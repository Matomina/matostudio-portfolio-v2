name: CI

on:
  push:
    branches:
      - main
      - chore/repo-professional-base
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: |
          npm run lint
          npx prettier --write src/pages/dashboard/DashboardContactsPage.tsx src/pages/dashboard/DashboardOverviewPage.tsx src/pages/dashboard/DashboardStatsPage.tsx
          git diff -- src/pages/dashboard/DashboardContactsPage.tsx src/pages/dashboard/DashboardOverviewPage.tsx src/pages/dashboard/DashboardStatsPage.tsx
          exit 1
